# Netlify build config for the Vite app.
#
# There are no functions here and no secrets to set. The Ask feature
# answers from a deterministic local composer over the retrieved seed
# facts — no model call, no API key, nothing that bills. Deploying this
# site cannot incur a charge.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: serve index.html for anything that is not a real file,
# so a deep link does not 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
